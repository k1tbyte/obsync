name: Deploy Auth Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure KV namespace
        working-directory: packages/auth-worker
        env:
          SHARE_TOKENS_KV_ID: ${{ secrets.SHARE_TOKENS_KV_ID }}
        run: |
          if [[ ! "$SHARE_TOKENS_KV_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::SHARE_TOKENS_KV_ID must be a 32-character hexadecimal KV namespace ID."
            exit 1
          fi
          sed -i "s/^id = \"\"$/id = \"$SHARE_TOKENS_KV_ID\"/" wrangler.toml
          grep -q "^id = \"$SHARE_TOKENS_KV_ID\"$" wrangler.toml

      - name: Deploy
        run: pnpm --filter obsync-auth-worker run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
