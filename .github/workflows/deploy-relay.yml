name: Deploy Relay

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter obsync-relay run test

      # The KV namespace and Durable Object are created by wrangler on the first
      # deploy; only the secrets below come from the repository.
      - name: Deploy
        working-directory: packages/relay
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "$RELAY_SECRET" ]; then
            echo "::error::Add a RELAY_SECRET repository secret (Obsync settings -> Connection -> Relay server -> Generate)."
            exit 1
          fi
          secrets="$RUNNER_TEMP/relay-secrets.json"
          jq -n 'env | {RELAY_SECRET, GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET} | with_entries(select(.value != null and .value != ""))' > "$secrets"
          pnpm exec wrangler deploy --secrets-file "$secrets" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "Relay URL: \`$url\` - paste it into Obsync settings -> Connection -> Relay server." >> "$GITHUB_STEP_SUMMARY"
