<!doctype html>
<meta charset="utf-8">
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 800px; overflow: hidden; }
	body {
		font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
		color: #fff;
		background:
			radial-gradient(760px 460px at 82% 6%, rgb(124 92 255 / 38%), transparent 62%),
			radial-gradient(640px 420px at 6% 104%, rgb(45 212 191 / 14%), transparent 62%),
			linear-gradient(135deg, #0d0b16 0%, #16122e 55%, #0d0b16 100%);
	}
	header { position: absolute; left: 44px; top: 30px; right: 44px; }
	h2 {
		font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em;
		background: linear-gradient(180deg, #fff 30%, #b4a0ff 100%); -webkit-background-clip: text; color: transparent;
	}
	p { margin-top: 8px; font-size: 20px; color: #d8d3e8; font-weight: 500; }
	.stage {
		position: absolute; left: 44px; right: 44px; top: 122px; bottom: 30px;
		display: flex; align-items: center; justify-content: center;
	}
	img {
		display: block; max-width: 100%; max-height: 100%; border-radius: 14px;
		border: 1px solid rgb(255 255 255 / 16%);
		box-shadow: 0 30px 60px -12px rgb(0 0 0 / 70%), 0 0 0 1px rgb(0 0 0 / 45%);
	}
</style>
<header><h2 id="t">Title</h2><p id="s"></p></header>
<div class="stage"><img id="i" alt=""></div>
<script>
	const q = new URLSearchParams(location.search);
	document.getElementById("t").textContent = q.get("title");
	document.getElementById("s").textContent = q.get("sub");
	document.getElementById("i").src = q.get("img");
</script>
